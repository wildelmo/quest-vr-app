<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NOCTURNE — credits &amp; licenses</title>
<link rel="stylesheet" href="./assets/fonts/fonts.css" />
<style>
  :root { --ink: #e9eef5; --dim: #93a0b3; --bg: #04070d; --glow: #6ff3ff; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.65 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 46rem; margin: 0 auto; padding: 4rem 1.5rem 6rem; }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 400; letter-spacing: 0.25em; text-indent: 0.25em; font-size: 2.4rem; margin: 0 0 0.2rem; text-align: center; }
  .sub { text-align: center; color: var(--dim); font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.2rem; margin-bottom: 3rem; }
  h2 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 1.5rem; margin: 2.4rem 0 0.6rem; letter-spacing: 0.04em; }
  a { color: #9fd8e8; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; color: #c9d3df; background: rgba(233,238,245,0.06); padding: 0 0.3em; border-radius: 4px; }
  ul { padding-left: 1.2rem; } li { margin: 0.5rem 0; color: #c2cad6; }
  p { color: #c2cad6; }
  .back { display: inline-block; margin-bottom: 2rem; color: var(--dim); text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← back to the water</a>
  <h1>NOCTURNE</h1>
  <div class="sub">credits &amp; licenses</div>
  <div id="md"><p>Loading…</p></div>
</main>
<script>
// A small Markdown renderer for CREDITS.md (headings, paragraphs, lists, links, bold, italics, code).
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
  s = s.replace(/&lt;(https?:\/\/[^&\s]+)&gt;/g, '<a href="$1" rel="noopener">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let html = '', para = [], list = [], item = null;
  const flushPara = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const flushItem = () => { if (item !== null) { list.push(`<li>${inline(item)}</li>`); item = null; } };
  const flushList = () => { flushItem(); if (list.length) { html += `<ul>${list.join('')}</ul>`; list = []; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) { flushPara(); flushList(); if (h[1].length > 1) html += `<h2>${inline(h[2])}</h2>`; continue; }
    const li = /^\s*[-*]\s+(.*)$/.exec(line);
    if (li) { flushPara(); flushItem(); item = li[1]; continue; }
    if (/^\s{2,}\S/.test(line) && item !== null) { item += ' ' + line.trim(); continue; }
    if (line.trim() === '') { flushPara(); flushList(); continue; }
    if (item !== null) { item += ' ' + line.trim(); continue; }
    para.push(line.trim());
  }
  flushPara(); flushList();
  return html;
}
fetch('./CREDITS.md').then((r) => r.text()).then((t) => { document.getElementById('md').innerHTML = render(t); })
  .catch(() => { document.getElementById('md').innerHTML = '<p>Could not load CREDITS.md — it is in the repository root.</p>'; });
</script>
</body>
</html>
